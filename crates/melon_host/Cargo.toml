[package]
name = "melon_host"
default-run = "melon_host"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
melon_core.workspace = true
melon_render.workspace = true
melon_physics.workspace = true
melon_editor.workspace = true
melon_game.workspace = true
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true
egui.workspace = true
slint = { workspace = true, optional = true }
hot-lib-reloader.workspace = true

[features]
default = ["hot-reload"]
hot-reload = []
imgui-poc = ["melon_editor/imgui-poc"]
slint-poc = ["dep:slint", "melon_editor/slint-poc"]

[[bin]]
name = "melon_slint_poc"
path = "src/bin/melon_slint_poc.rs"
required-features = ["slint-poc"]

[lints]
workspace = true