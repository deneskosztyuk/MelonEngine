[package]
name = "melon_host"
default-run = "melon_host"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
path = "src/game_build.rs"

[dependencies]
melon_core.workspace = true
melon_render.workspace = true
melon_physics.workspace = true
melon_audio.workspace = true
melon_editor = { workspace = true, optional = true }
melon_game.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true
egui = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }

[build-dependencies]
embed-resource.workspace = true

[features]
# `--no-default-features` is the player: no editor linked, game plugin linked statically.
default = ["hot-reload"]
editor = ["dep:melon_editor", "dep:egui"]
hot-reload = ["editor", "dep:libloading"]


[lints]
workspace = true